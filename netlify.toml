# Netlify build settings for the Next.js app.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime: deploys the server-rendered pages, server actions and
# middleware as Netlify Functions (without it only static files are uploaded).
[[plugins]]
  package = "@netlify/plugin-nextjs"
